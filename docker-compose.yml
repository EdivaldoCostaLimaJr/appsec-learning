services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: corp
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  web:
    build:
      context: .
      dockerfile: app-vuln/Dockerfile
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: corp
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - db
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp:unconfined

volumes:
  db-data:
