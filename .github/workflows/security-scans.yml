name: Security Scans

on:
  push:
    branches: [scan-workflows, codigovul-lab, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Análise estática do código (SAST)
  code:
    name: Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Semgrep
        run: python -m pip install --quiet semgrep
      - name: Rodar Semgrep
        continue-on-error: true
        run: semgrep scan --config=auto --metrics=off --json --output semgrep.json .
      - name: Resumo
        if: always()
        run: python3 .github/scripts/summarize.py --tool semgrep --input semgrep.json --summary "$GITHUB_STEP_SUMMARY"

  # 2) Secret scanning
  secret:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Rodar Gitleaks
        continue-on-error: true
        run: gitleaks detect --source . --no-banner --redact --report-format json --report-path gitleaks.json
      - name: Resumo
        if: always()
        run: python3 .github/scripts/summarize.py --tool gitleaks --input gitleaks.json --summary "$GITHUB_STEP_SUMMARY"

  # 3) Infraestrutura como código + configs (Terraform, Dockerfile, compose)
  iac:
    name: IaC & Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.52.2/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.52.2
      - name: Rodar Trivy (config/misconfig)
        continue-on-error: true
        run: trivy config --format json --output trivy-config.json .
      - name: Resumo
        if: always()
        run: python3 .github/scripts/summarize.py --tool trivy-config --input trivy-config.json --summary "$GITHUB_STEP_SUMMARY"

  # 4) Container (vulnerabilidades da imagem)
  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.52.2/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.52.2
      - name: Build da imagem
        run: docker build -t appvuln:ci -f app-vuln/Dockerfile .
      - name: Rodar Trivy (image scan)
        continue-on-error: true
        run: trivy image --format json --output trivy-image.json --severity CRITICAL,HIGH,MEDIUM appvuln:ci
      - name: Resumo
        if: always()
        run: python3 .github/scripts/summarize.py --tool trivy-image --input trivy-image.json --summary "$GITHUB_STEP_SUMMARY"
